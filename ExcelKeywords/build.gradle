plugins {
  id 'java'
  id 'groovy'
  id 'com.github.johnrengelman.shadow' version '7.1.0'
  id "com.katalon.gradle-plugin" version "0.1.2"
}

repositories {
  mavenCentral()
  maven {
    url 'https://jaspersoft.jfrog.io/jaspersoft/jaspersoft-repo/'
  }
  flatDir {
    dirs 'lib'
  }
}

def pluginSources = [
  'Keywords',
  'Test Listeners',
  'Include/scripts/groovy'
]

sourceSets {
   main {
    groovy {
      srcDirs = pluginSources
      srcDir 'Libs' // generated by Katalon Studio
    }
  }
}


java {
    withSourcesJar()
    // and/or analogously use “withJavadocJar()” to get a “javadocJar” task
}

shadowJar {
  exclude 'Temp*.class'
}

groovydoc {
  source = pluginSources
  docTitle = 'Excel Custom Keywords'
}

